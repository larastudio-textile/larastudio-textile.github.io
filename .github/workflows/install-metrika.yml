name: Install Lara Studio Yandex Metrika

on:
  push:
    paths:
      - ".github/workflows/install-metrika.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Insert Yandex Metrika into all pages and track events
        run: python scripts/install_metrika.py
      - name: Commit site changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.html' shared/studio.js
          if ! git diff --cached --quiet; then
            git commit -m "Enable Yandex Metrika 114109222 and shop activity tracking"
            git push
          else
            echo "Tracking already installed"
          fi
